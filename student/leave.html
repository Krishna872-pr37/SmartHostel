<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Request | Smart Hostel</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Smart Hostel</h2>
      <p>Student Portal</p>

      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="#">My Profile</a>
        <a href="#">My Room</a>
        <a href="#">Mess Menu</a>
        <a href="leave.html">Leave / Outpass</a>
        <a href="#">Complaints</a>
        <a href="#">Fees</a>
        <a href="#">Announcements</a>
        <a href="../index.html">Logout</a>
      </nav>
    </aside>

    <main class="dashboard-content">
      <h1>Apply for Leave / Outpass</h1>
      <p>Fill in the details below to send a leave request to the warden.</p>

      <section class="form-card">
        <form id="leaveForm">
          <label for="fromDate">From Date</label>
          <input type="date" id="fromDate" required>

          <label for="toDate">To Date</label>
          <input type="date" id="toDate" required>

          <label for="destination">Destination</label>
          <input type="text" id="destination" placeholder="Example: Kochi" required>

          <label for="contact">Emergency Contact</label>
          <input type="tel" id="contact" placeholder="Enter phone number" required>

          <label for="reason">Reason for Leave</label>
          <textarea id="reason" rows="5" placeholder="Write your reason here" required></textarea>

          <button type="submit">Submit Leave Request</button>
        </form>
      </section>
    </main>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
